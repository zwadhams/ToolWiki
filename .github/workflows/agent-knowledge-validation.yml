name: Validate agent knowledge

on:
  push:
    branches: [codex/agent-knowledge]
  pull_request:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'src/lib/knowledge-*'
      - 'src/pages/knowledge/**'
      - 'src/content/docs/guides/*agents*.md'
      - 'tests/mcp/**'
      - 'scripts/check-knowledge.mjs'
      - 'audits/agent-knowledge/readers/memory/reader-commands.ps1'
      - '.github/workflows/agent-knowledge-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mcp:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
  memory-reader:
    if: github.event_name != 'push' || github.ref == 'refs/heads/codex/agent-knowledge'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the independently prepared MCP reader commands
        shell: pwsh
        run: ./audits/agent-knowledge/readers/memory/reader-commands.ps1 -OutputPath "$env:RUNNER_TEMP/mcp-memory-evidence"
      - name: Retain new memory execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mcp-memory-evidence/*.json
            ${{ runner.temp }}/mcp-memory-evidence/*.txt
          if-no-files-found: error
          retention-days: 30
