[project]
name = "parcel-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = ["ruff==0.14.3", "mypy==1.18.2"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/parcel_demo/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^src/parcel_demo/generated/"]
